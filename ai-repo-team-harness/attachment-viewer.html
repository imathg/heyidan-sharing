<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/heyidan-sharing/favicon.svg">
<title>附件 — AI repo，其实就是一套团队级 harness</title>
<style>
:root {
  --bg: #0d1117;
  --bg-card: #131922;
  --border: #2a3441;
  --text: #e6edf3;
  --text-secondary: #9aa6b2;
  --accent: #5fd0c8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
}
.wrap { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.back, .download { color: var(--accent); text-decoration: none; font-size: 13px; }
h1 { margin: 0 0 18px; font-size: 24px; line-height: 1.3; }
.note { color: var(--text-secondary); margin-bottom: 18px; font-size: 13px; }
pre {
  margin: 0;
  padding: 22px;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg-card);
  color: var(--text);
  font: 13px/1.65 "SFMono-Regular", Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  tab-size: 2;
}
.error { color: #ff8b8b; }
@media (max-width: 620px) {
  .wrap { width: min(100% - 20px, 1100px); padding-top: 18px; }
  h1 { font-size: 20px; }
  pre { padding: 14px; font-size: 12px; }
}
</style>
</head>
<body>
<main class="wrap">
  <div class="topbar">
    <a class="back" href="./">← 返回文章</a>
    <a class="download" id="download" download>下载原文件</a>
  </div>
  <h1 id="title">附件</h1>
  <p class="note">以下内容按 UTF-8 显式解码显示。</p>
  <pre id="content">正在加载……</pre>
</main>
<script>
const allowedFiles = new Set([
  "CLAUDE.md.txt",
  "HANDOFF_harness.md.txt",
  "format-tables.md.txt"
]);
const params = new URLSearchParams(window.location.search);
const file = params.get("file");
const title = params.get("title") || "附件";
const content = document.getElementById("content");
const download = document.getElementById("download");

if (!allowedFiles.has(file)) {
  content.textContent = "附件不存在或不允许访问。";
  content.classList.add("error");
  download.hidden = true;
} else {
  document.title = title + " — 附件";
  document.getElementById("title").textContent = title;
  const source = "assets/" + encodeURIComponent(file);
  download.href = source;
  fetch(source)
    .then(response => {
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.arrayBuffer();
    })
    .then(buffer => {
      content.textContent = new TextDecoder("utf-8").decode(buffer);
    })
    .catch(error => {
      content.textContent = "附件加载失败：" + error.message;
      content.classList.add("error");
    });
}
</script>
</body>
</html>
