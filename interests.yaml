# 雷达兴趣表 — heyidan-sharing 公开仓版（公开安全子集）。
#
# 这是 imathg/knowledge-base/compiler/interests.yaml 的公共子集：
#   - 包含 domains / arxiv / rss_feeds / exclude
#   - 不含 me / tech_shares / chrome_mcp（本地脚本用，含 ByteDance 内部标识）
#
# 编辑规则：
#   - **canonical 是私有仓 knowledge-base/compiler/interests.yaml**
#   - 本仓只跑 scripts/ingest_feeds_arxiv.py + scripts/ingest_feeds_rss.py（云端 routine）
#   - 改 domains/keywords/feeds 后，在 bytedance-mac 上跑：
#       python3 /Users/bytedance/knowledge-base/tools/sync_interests_to_public.py --apply
#     把私有仓的对应段同步过来
#   - 不要在本仓直接编辑这个文件（会被同步脚本覆盖）

rss_feeds:
- name: OpenAI Blog
  url: https://openai.com/news/rss.xml
  category: official
- name: Google DeepMind Blog
  url: https://deepmind.google/blog/rss.xml
  category: official
- name: Lilian Weng
  url: https://lilianweng.github.io/index.xml
  category: personal
- name: Bounded Regret (Steinhardt)
  url: https://bounded-regret.ghost.io/rss/
  category: personal
- name: Karpathy
  url: https://karpathy.github.io/feed.xml
  category: personal
- name: Chip Huyen
  url: https://huyenchip.com/feed.xml
  category: personal
- name: Sebastian Raschka
  url: https://magazine.sebastianraschka.com/feed
